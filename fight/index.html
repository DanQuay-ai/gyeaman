<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gyeaman Fight</title>
<link rel="icon" href="../squads/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@600;800&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "Koradin"; src: url("../squads/Koradin.otf") format("opentype"); font-display: swap; }
:root { --gold: #e3b448; --ink: #0d0a0a; --red: #c8322a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); color: #f3e7cf; font-family: Karla, system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
#hand { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; gap: 10px; z-index: 2; }
.card { position: relative; width: min(19vw, 92px, 15vh); aspect-ratio: 3 / 4.2; border-radius: 10px; border: 2px solid var(--c, #e3b448); background: linear-gradient(170deg, #2a170c, #0d0a0a 70%); color: #f3e7cf; padding: 0; overflow: hidden; font: 800 11px Karla, sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 0 0 2px rgba(0,0,0,.6); touch-action: none; cursor: pointer; }
.card img { position: absolute; inset: 0 0 34% 0; width: 100%; height: 66%; object-fit: cover; opacity: .9; }
.card b { position: absolute; left: 4px; right: 4px; bottom: 16px; font: 13px Anton, sans-serif; letter-spacing: .02em; line-height: 1.05; text-align: center; text-shadow: 0 1px 2px #000; }
.card i { position: absolute; left: 0; right: 0; bottom: 3px; font-style: normal; font-size: 9px; letter-spacing: .14em; color: var(--c, #e3b448); text-align: center; }
.card.pop { animation: pop .32s cubic-bezier(.2,1.6,.4,1); }
.card.sp { border-color: #c58bff; box-shadow: 0 0 18px rgba(197,139,255,.6); }
.card.sp.pop { animation: pop .32s cubic-bezier(.2,1.6,.4,1), glow 1s ease-in-out infinite alternate .32s; }
.card.empty { border-style: dashed; border-color: rgba(227,180,72,.3); background: rgba(0,0,0,.35); box-shadow: none; }
.card.empty::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--p, 0) * 100%); background: rgba(227,180,72,.18); }
.card.empty.sp { border-color: rgba(197,139,255,.3); }
.card.empty i { color: rgba(197,139,255,.6); }
.card:active { transform: translateY(-6px) scale(1.04); }
@keyframes pop { from { transform: translateY(40px) scale(.6) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes glow { to { box-shadow: 0 0 30px rgba(197,139,255,.95); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hand"></div>
<script type="module" src="fight.js?v=4"></script>
</body>
</html>
