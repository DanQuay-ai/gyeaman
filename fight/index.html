<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gyeaman Fight</title>
<link rel="icon" href="../squads/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@600;800&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "Koradin"; src: url("../squads/Koradin.otf") format("opentype"); font-display: swap; }
:root { --gold: #e3b448; --ink: #0d0a0a; --red: #c8322a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); color: #f3e7cf; font-family: Karla, system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
#touch { position: fixed; inset: auto 0 0 0; height: 46%; display: none; pointer-events: none; }
body.touch #touch { display: block; }
#stick { position: absolute; left: 4%; bottom: 8%; width: 34vmin; height: 34vmin; pointer-events: auto; }
#stick .base { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(227,180,72,.35); background: radial-gradient(circle, rgba(0,0,0,.05), rgba(0,0,0,.3)); }
#stick .knob { position: absolute; left: 50%; top: 50%; width: 40%; height: 40%; margin: -20% 0 0 -20%; border-radius: 50%; background: rgba(227,180,72,.35); border: 2px solid rgba(255,230,160,.5); }
.btns { position: absolute; right: 3%; bottom: 6%; width: 44vmin; height: 36vmin; pointer-events: auto; }
.btns b { position: absolute; width: 17vmin; height: 17vmin; border-radius: 50%; display: grid; place-items: center; font: 800 3.4vmin Karla; color: #fff; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.28); }
.btns b.on { background: rgba(227,180,72,.45); }
.btns .L { left: 0; bottom: 0; } .btns .H { left: 34%; bottom: 30%; } .btns .S { right: 0; bottom: 56%; border-color: var(--gold); color: var(--gold); } .btns .B { right: 2%; bottom: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div id="stick"><div class="base"></div><div class="knob"></div></div>
  <div class="btns"><b class="L" data-k="L">LIGHT</b><b class="H" data-k="H">HEAVY</b><b class="S" data-k="S">SPECIAL</b><b class="B" data-k="B">GUARD</b></div>
</div>
<script type="module" src="fight.js?v=1"></script>
</body>
</html>
