# Deploys the static site to Netlify on every push to main.
# Needs one repo secret: NETLIFY_AUTH_TOKEN (Netlify > User settings > Applications > Personal access tokens).
name: Deploy to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: netlify-prod, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: adec0faa-1173-44ba-a902-c1dd301112e2
        run: npx -y netlify-cli@17 deploy --prod --dir=. --message "${GITHUB_SHA::7}"
